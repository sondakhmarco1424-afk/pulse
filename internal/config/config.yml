app:
  version: "1.0"
  env: ${APP_ENV|development}
  enable_auth: ${APP_ENABLE_AUTH|true}
  traccar_go_live_timeout: ${TRACCAR_TIMEOUT|360}
  online_timeout: ${ONLINE_TIMEOUT|120}


server:
  host: ${SERVER_HOST|}
  port: ${SERVER_PORT|8081}
  base_path: ${SERVER_BASEPATH|}

db:
  mysql:
    enabled: true
    host: ${DB_HOST|localhost}
    port: ${DB_PORT|3306}
    user: ${DB_USER|root}
    pass: ${DB_PASSWORD|}
    schema : ${DB_SCHEMA|pulse_system}

redis:
  host: ${REDIS_HOST|localhost}
  port: ${REDIS_PORT|6380}
  password: ${REDIS_PASSWORD|}
  expiry: ${REDIS_EXPIRY_MINUTES|7}
  db: ${REDIS_DB|0}
  max_retries: ${REDIS_MAX_RETRIES|5}
  dial_timeout_seconds: ${REDIS_DIAL_TIMEOUT_SECONDS|5}
  read_timeout_seconds: ${REDIS_READ_TIMEOUT_SECONDS|3}
  write_timeout_seconds: ${REDIS_WRITE_TIMEOUT_SECONDS|3}
  pool_timeout_seconds: ${REDIS_POOL_TIMEOUT_SECONDS|5}
  reconnect_min_seconds: ${REDIS_RECONNECT_MIN_SECONDS|1}
  reconnect_max_seconds: ${REDIS_RECONNECT_MAX_SECONDS|30}

binance:
  ws_url: ${BINANCE_WS_URL|}
  reconnect_delay_seconds: ${BINANCE_RECONNECT_DELAY_SECONDS|5}

firebase:
  enabled: ${FIREBASE_ENABLED|true}
  service_account_key: ${FIREBASE_SERVICE_ACCOUNT_KEY|}

kafka:
  brokers: ${KAFKA_BROKERS|localhost:9092}
  fcm_notifications_topic: ${KAFKA_FCM_NOTIFICATIONS_TOPIC|fcm-notifications}

