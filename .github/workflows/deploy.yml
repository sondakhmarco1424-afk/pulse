name: Deploy Pulse to AWS EC2

on:
  push:
    branches:
      - main
      - develop

permissions:
  contents: read
  packages: write

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build images and deploy to AWS EC2
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve Image Names
        id: images
        shell: bash
        run: |
          set -euo pipefail
          repository="${GITHUB_REPOSITORY,,}"
          echo "backend=ghcr.io/${repository}-backend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"
          echo "frontend=ghcr.io/${repository}-frontend:${GITHUB_SHA}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and Publish Backend Image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.backend }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=pulse-backend
          cache-to: type=gha,mode=max,scope=pulse-backend

      - name: Build and Publish Frontend Image
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.images.outputs.frontend }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=pulse-frontend
          cache-to: type=gha,mode=max,scope=pulse-frontend

      - name: Read EC2 Repository Revision
        id: remote-revision
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 1m
          capture_stdout: true
          script: |
            set -eu
            cd ~/Pulse
            git rev-parse --verify "refs/heads/${{ github.ref_name }}"

      - name: Package Repository Update
        id: package-update
        env:
          REMOTE_OUTPUT: ${{ steps.remote-revision.outputs.stdout }}
        run: |
          set -euo pipefail
          REMOTE_SHA="$(printf '%s\n' "$REMOTE_OUTPUT" | grep -Eo '[0-9a-f]{40}' | tail -n 1 || true)"
          if [[ -z "$REMOTE_SHA" ]]; then
            echo "Unable to determine the EC2 repository revision."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$REMOTE_SHA" "$GITHUB_SHA"; then
            echo "EC2 revision $REMOTE_SHA is not an ancestor of $GITHUB_SHA; refusing a non-fast-forward deployment."
            exit 1
          fi
          if [[ "$REMOTE_SHA" == "$GITHUB_SHA" ]]; then
            echo "needed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git bundle create pulse-source.bundle "refs/heads/${GITHUB_REF_NAME}" "^${REMOTE_SHA}"
          git bundle verify pulse-source.bundle
          echo "needed=true" >> "$GITHUB_OUTPUT"

      - name: Upload Repository Bundle to EC2
        if: steps.package-update.outputs.needed == 'true'
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          source: pulse-source.bundle
          target: /home/${{ secrets.EC2_USERNAME }}/Pulse/.deploy
          overwrite: true

      - name: Pull Images and Deploy on EC2
        uses: appleboy/ssh-action@v1.2.5
        env:
          REGISTRY_USERNAME: ${{ github.actor }}
          REGISTRY_PASSWORD: ${{ secrets.GITHUB_TOKEN }}
          PULSE_APP_IMAGE: ${{ steps.images.outputs.backend }}
          PULSE_FRONTEND_IMAGE: ${{ steps.images.outputs.frontend }}
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 10m
          envs: REGISTRY_USERNAME,REGISTRY_PASSWORD,PULSE_APP_IMAGE,PULSE_FRONTEND_IMAGE
          script: |
            set -eu

            DEPLOY_DOCKER_CONFIG="$(mktemp -d)"
            export DOCKER_CONFIG="$DEPLOY_DOCKER_CONFIG"
            cleanup_registry_auth() {
              rm -rf "$DEPLOY_DOCKER_CONFIG"
            }
            trap cleanup_registry_auth EXIT INT TERM

            cd ~/Pulse
            BRANCH="${{ github.ref_name }}"
            EXPECTED_SHA="${{ github.sha }}"
            BUNDLE_PATH="$HOME/Pulse/.deploy/pulse-source.bundle"
            CURRENT_SHA="$(git rev-parse --verify "refs/heads/$BRANCH")"

            if [ "$CURRENT_SHA" != "$EXPECTED_SHA" ]; then
              if [ ! -f "$BUNDLE_PATH" ]; then
                echo "Deployment blocked: repository bundle was not uploaded to $BUNDLE_PATH."
                exit 1
              fi
              git fetch "$BUNDLE_PATH" "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            fi

            git checkout "$BRANCH"
            if [ "$(git rev-parse --verify HEAD)" != "$EXPECTED_SHA" ]; then
              git merge --ff-only "origin/$BRANCH"
            fi
            if [ "$(git rev-parse --verify HEAD)" != "$EXPECTED_SHA" ]; then
              echo "Deployment blocked: EC2 did not reach expected revision $EXPECTED_SHA."
              exit 1
            fi
            if [ ! -f .env ]; then
              echo "Deployment blocked: ~/Pulse/.env is missing."
              exit 1
            fi

            if [ "$BRANCH" = "main" ]; then
              COMPOSE_FILE="docker-compose-pulse.yml"
              APP_SERVICE="pulse_app"
              FRONTEND_SERVICE="pulse_frontend"
              APP_CONTAINER="pulse_app"
              FRONTEND_CONTAINER="pulse_frontend"
            else
              COMPOSE_FILE="docker-compose-dev.yml"
              APP_SERVICE="pulse_app_dev"
              FRONTEND_SERVICE="pulse_frontend_dev"
              APP_CONTAINER="pulse_app_dev"
              FRONTEND_CONTAINER="pulse_frontend_dev"
            fi

            export PULSE_APP_IMAGE PULSE_FRONTEND_IMAGE
            docker compose --env-file .env -f "$COMPOSE_FILE" config --quiet

            printf '%s' "$REGISTRY_PASSWORD" | docker login ghcr.io --username "$REGISTRY_USERNAME" --password-stdin

            PREVIOUS_APP_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$APP_CONTAINER" 2>/dev/null || true)"
            PREVIOUS_FRONTEND_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$FRONTEND_CONTAINER" 2>/dev/null || true)"

            echo "Pulling application images built by GitHub Actions..."
            docker compose --env-file .env -f "$COMPOSE_FILE" pull "$APP_SERVICE" "$FRONTEND_SERVICE"

            remove_legacy_dev_container() {
              container_name="$1"
              legacy_project="$(docker inspect --format '{{index .Config.Labels "com.docker.compose.project"}}' "$container_name" 2>/dev/null || true)"
              if [ "$legacy_project" = "pulse" ]; then
                echo "Removing legacy dev container $container_name from the old Compose project..."
                docker rm --force "$container_name"
              fi
            }

            if [ "$BRANCH" != "main" ]; then
              remove_legacy_dev_container "$APP_CONTAINER"
              remove_legacy_dev_container "$FRONTEND_CONTAINER"
            fi

            rollback() {
              if [ -z "$PREVIOUS_APP_IMAGE" ] || [ -z "$PREVIOUS_FRONTEND_IMAGE" ]; then
                echo "No complete previous application image set is available for automatic rollback."
                return
              fi
              echo "Rolling back to the previous application images..."
              PULSE_APP_IMAGE="$PREVIOUS_APP_IMAGE" \
              PULSE_FRONTEND_IMAGE="$PREVIOUS_FRONTEND_IMAGE" \
                docker compose --env-file .env -f "$COMPOSE_FILE" up -d --no-build --pull never \
                  "$APP_SERVICE" "$FRONTEND_SERVICE" || true
            }

            echo "Starting containers without building on EC2..."
            if ! docker compose --env-file .env -f "$COMPOSE_FILE" up -d --no-build --pull never --remove-orphans \
              "$APP_SERVICE" "$FRONTEND_SERVICE"; then
              rollback
              exit 1
            fi

            wait_for_healthy() {
              container_name="$1"
              attempts=36
              while [ "$attempts" -gt 0 ]; do
                state="$(docker inspect --format '{{if .State.Health}}{{.State.Health.Status}}{{else}}{{.State.Status}}{{end}}' "$container_name" 2>/dev/null || true)"
                case "$state" in
                  healthy|running)
                    return 0
                    ;;
                  unhealthy|exited|dead)
                    break
                    ;;
                esac
                attempts=$((attempts - 1))
                sleep 5
              done
              echo "$container_name did not become healthy."
              docker logs --tail 100 "$container_name" || true
              return 1
            }

            if ! wait_for_healthy "$APP_CONTAINER" || ! wait_for_healthy "$FRONTEND_CONTAINER"; then
              rollback
              exit 1
            fi

            ACTUAL_APP_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$APP_CONTAINER")"
            ACTUAL_FRONTEND_IMAGE="$(docker inspect --format '{{.Config.Image}}' "$FRONTEND_CONTAINER")"
            if [ "$ACTUAL_APP_IMAGE" != "$PULSE_APP_IMAGE" ] || [ "$ACTUAL_FRONTEND_IMAGE" != "$PULSE_FRONTEND_IMAGE" ]; then
              echo "Deployment verification failed: running image tags do not match the requested commit."
              rollback
              exit 1
            fi

            echo "Deployment complete at $EXPECTED_SHA; no images were built on EC2."
