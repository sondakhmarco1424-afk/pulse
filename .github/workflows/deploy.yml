name: Deploy Pulse to AWS EC2

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 5m
          script: |
            cd ~/Pulse || cd Pulse
            git fetch origin
            BRANCH="${{ github.ref_name }}"
            git checkout $BRANCH
            git pull origin $BRANCH
            if [ "$BRANCH" = "main" ]; then
              echo "🚀 Deploying MAIN branch to Production (docker-compose-pulse.yml)..."
              DOCKER_BUILDKIT=0 docker compose -f docker-compose-pulse.yml up -d --build --pull missing
            else
              echo "🧪 Deploying DEVELOP branch to Staging/Dev (docker-compose-dev.yml)..."
              DOCKER_BUILDKIT=0 docker compose -f docker-compose-dev.yml up -d --build --pull missing
            fi
