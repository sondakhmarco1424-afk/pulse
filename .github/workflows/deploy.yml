name: Deploy Pulse to AWS EC2

on:
  push:
    branches:
      - main
      - develop

jobs:
  deploy:
    name: Deploy to AWS EC2
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Deploy via SSH to EC2
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          port: 22
          command_timeout: 15m
          script: |
            set -eu

            retry() {
              attempt=1
              max_attempts=3
              while ! "$@"; do
                if [ "$attempt" -ge "$max_attempts" ]; then
                  echo "Command failed after $attempt attempts: $*"
                  return 1
                fi
                delay=$((attempt * 5))
                echo "Command failed (attempt $attempt/$max_attempts); retrying in ${delay}s..."
                sleep "$delay"
                attempt=$((attempt + 1))
              done
            }

            cd ~/Pulse || cd Pulse
            BRANCH="${{ github.ref_name }}"
            retry git -c http.lowSpeedLimit=1000 -c http.lowSpeedTime=30 fetch --prune origin "+refs/heads/$BRANCH:refs/remotes/origin/$BRANCH"
            git checkout "$BRANCH"
            git merge --ff-only "origin/$BRANCH"
            if [ ! -f .env ]; then
              echo "Deployment blocked: ~/Pulse/.env is missing. Create it from .env.example and supply the required secrets."
              exit 1
            fi
            if [ "$BRANCH" = "main" ]; then
              echo "🚀 Deploying MAIN branch to Production (docker-compose-pulse.yml)..."
              docker compose --env-file .env -f docker-compose-pulse.yml config --quiet
              DOCKER_BUILDKIT=1 docker compose --env-file .env -f docker-compose-pulse.yml up -d --build --pull missing --remove-orphans
            else
              echo "🧪 Deploying DEVELOP branch to Staging/Dev (docker-compose-dev.yml)..."
              docker compose --env-file .env -f docker-compose-dev.yml config --quiet
              DOCKER_BUILDKIT=1 docker compose --env-file .env -f docker-compose-dev.yml up -d --build --pull missing --remove-orphans
            fi
