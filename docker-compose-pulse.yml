name: ${COMPOSE_PROJECT_NAME:-pulse}

networks:
  pulse-system-net:
    name: ${PULSE_NETWORK_NAME:-pulse-system-net}

services:
  pulse_app_db:
    image: ${MYSQL_IMAGE:-mysql:8.0}
    container_name: pulse_app_mysql
    restart: unless-stopped
    init: true
    command: mysqld --default-authentication-plugin=mysql_native_password --character-set-server=utf8 --collation-server=utf8_unicode_ci
    environment:
      MYSQL_DATABASE: ${DB_SCHEMA:?DB_SCHEMA must be set in .env}
      MYSQL_USER: ${DB_USER:?DB_USER must be set in .env}
      MYSQL_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?MYSQL_ROOT_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    networks:
      - pulse-system-net
    healthcheck:
      test: ["CMD-SHELL", "MYSQL_PWD=\"$$MYSQL_ROOT_PASSWORD\" mysqladmin ping -h 127.0.0.1 -u root --silent"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    volumes:
      - ./docker/db_data:/var/lib/mysql
      - ./docker/db_sql:/docker-entrypoint-initdb.d:ro

  redis:
    image: ${REDIS_IMAGE:-redis:8.2-alpine}
    container_name: pulse_redis
    restart: unless-stopped
    init: true
    command:
      - redis-server
      - --bind
      - 0.0.0.0
      - --protected-mode
      - "yes"
      - --port
      - "6379"
      - --appendonly
      - "yes"
      - --appendfsync
      - everysec
      - --requirepass
      - ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      - --rename-command
      - FLUSHDB
      - ""
      - --rename-command
      - FLUSHALL
      - ""
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDISCLI_AUTH: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    ports:
      - "127.0.0.1:${REDIS_HOST_PORT:-6380}:6379"
    networks:
      - pulse-system-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    stop_grace_period: 30s
    volumes:
      - redis_data:/data

  redis-insight:
    image: ${REDIS_INSIGHT_IMAGE:-redis/redisinsight:latest}
    container_name: pulse_redis_insight
    restart: unless-stopped
    profiles: ["observability"]
    networks:
      - pulse-system-net
    ports:
      - "127.0.0.1:${REDIS_INSIGHT_HOST_PORT:-5540}:5540"
    volumes:
      - redis-insight:/data
    depends_on:
      redis:
        condition: service_healthy

  kafka:
    image: ${KAFKA_IMAGE:-confluentinc/cp-kafka:7.4.0}
    container_name: pulse_kafka
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${KAFKA_HOST_PORT:-9092}:9092"
      - "127.0.0.1:${KAFKA_INTERNAL_HOST_PORT:-29092}:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://${KAFKA_ADVERTISED_HOST:-localhost}:${KAFKA_HOST_PORT:-9092}
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:29093
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:29092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:9092
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LOG_DIRS: /tmp/kraft-combined-logs
      CLUSTER_ID: ${KAFKA_CLUSTER_ID:?KAFKA_CLUSTER_ID must be set in .env}
    networks:
      - pulse-system-net

  kafka-ui:
    image: ${KAFKA_UI_IMAGE:-provectuslabs/kafka-ui:latest}
    container_name: pulse_kafka_ui
    restart: unless-stopped
    ports:
      - "127.0.0.1:${KAFKA_UI_HOST_PORT:-8080}:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local-kafka
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:29092
    networks:
      - pulse-system-net
    depends_on:
      - kafka

  pulse_app:
    build:
      context: .
      dockerfile: dockerfile
    container_name: pulse_app
    restart: unless-stopped
    init: true
    ports:
      - "127.0.0.1:${API_HOST_PORT:-8081}:${SERVER_PORT:-8081}"
    environment:
      APP_ENV: ${APP_ENV:-production}
      APP_ENABLE_AUTH: ${APP_ENABLE_AUTH:-true}
      SERVER_PORT: ${SERVER_PORT:-8081}
      DB_HOST: ${DB_HOST:-pulse_app_db}
      DB_PORT: ${DB_PORT:-3306}
      DB_USER: ${DB_USER:?DB_USER must be set in .env}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DB_SCHEMA: ${DB_SCHEMA:?DB_SCHEMA must be set in .env}
      REDIS_HOST: ${REDIS_HOST:-redis}
      REDIS_PORT: ${REDIS_PORT:-6379}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
      REDIS_DB: ${REDIS_DB:-0}
      REDIS_EXPIRY_MINUTES: ${REDIS_EXPIRY_MINUTES:-7}
      REDIS_MAX_RETRIES: ${REDIS_MAX_RETRIES:-5}
      REDIS_DIAL_TIMEOUT_SECONDS: ${REDIS_DIAL_TIMEOUT_SECONDS:-5}
      REDIS_READ_TIMEOUT_SECONDS: ${REDIS_READ_TIMEOUT_SECONDS:-3}
      REDIS_WRITE_TIMEOUT_SECONDS: ${REDIS_WRITE_TIMEOUT_SECONDS:-3}
      REDIS_POOL_TIMEOUT_SECONDS: ${REDIS_POOL_TIMEOUT_SECONDS:-5}
      REDIS_RECONNECT_MIN_SECONDS: ${REDIS_RECONNECT_MIN_SECONDS:-1}
      REDIS_RECONNECT_MAX_SECONDS: ${REDIS_RECONNECT_MAX_SECONDS:-30}
      BINANCE_WS_URL: ${BINANCE_WS_URL:?BINANCE_WS_URL must be set in .env}
      BINANCE_RECONNECT_DELAY_SECONDS: ${BINANCE_RECONNECT_DELAY_SECONDS:-5}
      KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka:29092}
      KAFKA_FCM_NOTIFICATIONS_TOPIC: ${KAFKA_FCM_NOTIFICATIONS_TOPIC:-fcm-notifications}
      FIREBASE_ENABLED: ${FIREBASE_ENABLED:-true}
      FIREBASE_SERVICE_ACCOUNT_KEY: ${FIREBASE_SERVICE_ACCOUNT_CONTAINER_PATH:-/run/secrets/firebase-service-account.json}
    volumes:
      - type: bind
        source: ${FIREBASE_SERVICE_ACCOUNT_HOST_PATH:?FIREBASE_SERVICE_ACCOUNT_HOST_PATH must be set in .env}
        target: ${FIREBASE_SERVICE_ACCOUNT_CONTAINER_PATH:-/run/secrets/firebase-service-account.json}
        read_only: true
    networks:
      - pulse-system-net
    depends_on:
      pulse_app_db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started
    healthcheck:
      test: ["CMD-SHELL", "curl --fail --silent --show-error http://127.0.0.1:$${SERVER_PORT}/api/v1/binance/status >/dev/null"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  pulse_frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: pulse_frontend
    restart: unless-stopped
    init: true
    environment:
      BACKEND_UPSTREAM: pulse_app:${SERVER_PORT:-8081}
      VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
      VITE_APP_URL: ${VITE_APP_URL:-}
      VITE_BINANCE_WS_URL: ${VITE_BINANCE_WS_URL:?VITE_BINANCE_WS_URL must be set in .env}
      VITE_BINANCE_REST_BASE_URL: ${VITE_BINANCE_REST_BASE_URL:?VITE_BINANCE_REST_BASE_URL must be set in .env}
      VITE_FIREBASE_API_KEY: ${VITE_FIREBASE_API_KEY:?VITE_FIREBASE_API_KEY must be set in .env}
      VITE_FIREBASE_AUTH_DOMAIN: ${VITE_FIREBASE_AUTH_DOMAIN:?VITE_FIREBASE_AUTH_DOMAIN must be set in .env}
      VITE_FIREBASE_PROJECT_ID: ${VITE_FIREBASE_PROJECT_ID:?VITE_FIREBASE_PROJECT_ID must be set in .env}
      VITE_FIREBASE_STORAGE_BUCKET: ${VITE_FIREBASE_STORAGE_BUCKET:?VITE_FIREBASE_STORAGE_BUCKET must be set in .env}
      VITE_FIREBASE_MESSAGING_SENDER_ID: ${VITE_FIREBASE_MESSAGING_SENDER_ID:?VITE_FIREBASE_MESSAGING_SENDER_ID must be set in .env}
      VITE_FIREBASE_APP_ID: ${VITE_FIREBASE_APP_ID:?VITE_FIREBASE_APP_ID must be set in .env}
      VITE_FIREBASE_FIRESTORE_DATABASE_ID: ${VITE_FIREBASE_FIRESTORE_DATABASE_ID:?VITE_FIREBASE_FIRESTORE_DATABASE_ID must be set in .env}
      VITE_FIREBASE_VAPID_KEY: ${VITE_FIREBASE_VAPID_KEY:-}
      VITE_DEMO_MODE: ${VITE_DEMO_MODE:-false}
    ports:
      - "127.0.0.1:${FRONTEND_HOST_PORT:-3000}:80"
    networks:
      - pulse-system-net
    depends_on:
      pulse_app:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  redis_data:
    driver: local
  redis-insight:
    driver: local
